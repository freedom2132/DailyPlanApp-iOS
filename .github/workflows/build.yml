name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available simulators
        run: xcrun simctl list devices available | grep -i iphone | head -10

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project DailyPlanApp.xcodeproj \
            -scheme DailyPlanApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Zip App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ${{ github.workspace }}/DailyPlanApp-simulator.zip DailyPlanApp.app

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: DailyPlanApp-simulator
          path: DailyPlanApp-simulator.zip
          retention-days: 30
