name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project DailyPlanApp.xcodeproj \
            -scheme DailyPlanApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: DailyPlanApp-simulator
          path: build/Build/Products/Debug-iphonesimulator/DailyPlanApp.app
          retention-days: 30
